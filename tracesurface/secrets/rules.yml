
rules:
  - name: AWS Access Key
    group: 敏感信息
    sensitive: true
    f_regex: '(A3T[A-Z0-9]|AKIA|AGPA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'

  - name: 阿里云 AccessKey
    group: 敏感信息
    sensitive: true
    f_regex: '\b(LTAI[a-zA-Z0-9]{17,21})'

  - name: Google API Key
    group: 敏感信息
    sensitive: true
    f_regex: 'AIza[0-9a-z-_]{35}'

  - name: GitHub Token
    group: 敏感信息
    sensitive: true
    f_regex: '\b((?:ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9]{36,255}\b)'

  - name: GitLab PAT
    group: 敏感信息
    sensitive: true
    f_regex: '\b(glpat-[a-zA-Z0-9\-=_]{20,22})\b'

  - name: Stripe Secret Key
    group: 敏感信息
    sensitive: true
    f_regex: 'sk_(?:live|test)_[0-9a-zA-Z]{24}'

  - name: SendGrid API Key
    group: 敏感信息
    sensitive: true
    f_regex: 'SG\.[\w\-_]{20,24}\.[\w\-_]{39,50}'

  - name: Telegram Bot Token
    group: 敏感信息
    sensitive: true
    f_regex: '[0-9]+:AA[0-9A-Za-z\-_]{33}'

  - name: Mailgun API Key
    group: 敏感信息
    sensitive: true
    f_regex: 'key-[0-9a-zA-Z]{32}'

  - name: Shopify Access Token
    group: 敏感信息
    sensitive: true
    f_regex: 'shpat_[a-fA-F0-9]{32}'

  - name: Slack Token
    group: 敏感信息
    sensitive: true
    f_regex: 'xox[baprs]-[0-9a-zA-Z-]{10,72}'

  - name: 企业微信密钥
    group: 敏感信息
    sensitive: true
    f_regex: '((corp)(id|secret))'

  - name: JDBC 连接串
    group: 敏感信息
    sensitive: true
    f_regex: '(jdbc:[a-z:]+://[a-z0-9\.\-_:;=/@?,&]+)'

  - name: 私钥
    group: 敏感信息
    sensitive: true
    f_regex: '-----BEGIN ((EC|PGP|DSA|RSA|OPENSSH) )?PRIVATE KEY( BLOCK)?-----'

  - name: Slack Webhook
    group: 敏感信息
    sensitive: true
    f_regex: 'https://hooks.slack.com/services/T[a-zA-Z0-9_]{8,10}/B[a-zA-Z0-9_]{8,12}/[a-zA-Z0-9_]{23,24}'

  - name: Discord Webhook
    group: 敏感信息
    sensitive: true
    f_regex: 'https://discordapp\.com/api/webhooks/[0-9]+/[A-Za-z0-9\-]+'

  - name: JSON Web Token
    group: 指纹
    sensitive: true
    f_regex: '(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]{10,}|eyJ[A-Za-z0-9_\/+-]{10,}\.[A-Za-z0-9._\/+-]{10,})'

  - name: 内网 IP 地址
    group: 基础信息
    sensitive: false
    f_regex: '[^0-9]((127\.0\.0\.1)|(10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(172\.((1[6-9])|(2\d)|(3[01]))\.\d{1,3}\.\d{1,3})|(192\.168\.\d{1,3}\.\d{1,3}))'
